<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Revisión QR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .contenedor {
      max-width: 900px;
      margin: 40px auto;
      padding: 25px;
    }

    .encabezado {
      background: #1a73e8;
      color: white;
      padding: 25px;
      border-radius: 15px 15px 0 0;
      text-align: center;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 28px;
    }

    .encabezado p {
      margin-bottom: 0;
    }

    .contenido {
      background: white;
      padding: 25px;
      border-radius: 0 0 15px 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #333;
    }

    .actividad {
      background: #f8f9fa;
      border-left: 5px solid #1a73e8;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .actividad h3 {
      margin-top: 0;
      color: #1a73e8;
    }

    .actividad p {
      margin: 6px 0;
    }

    .boton {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .boton:hover {
      background: #1557b0;
    }

    .cargando {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 15px;
      border-radius: 8px;
    }

  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">
      <h1>SISTEMA DE REVISIÓN QR</h1>
      <p>Consulta de actividades</p>
    </div>

    <div class="contenido">

      <button class="boton" onclick="cargarActividades()">
        Actualizar actividades
      </button>

 <button id="botonProfesor" class="boton-qr" onclick="seleccionarTurno()">
    📷 Escanear código QR
</button>
      
  <button id="botonAlumno" class="boton-qr" onclick="modoEscaneo = 'consulta'; iniciarEscaner()">
  👤 Consultar avance del alumno
</button>

      <div id="resultado" class="cargando">
        Cargando actividades...
      </div>

      <div id="contenedor-escaner">

    <div class="escaner-box">

        <h2>Escanear código QR</h2>

        <video id="videoQR" autoplay playsinline></video>

        <p id="mensajeQR">
            Apunta la cámara hacia el código QR
        </p>

        <button onclick="detenerEscaner()">
            Cancelar
        </button>

    </div>

</div>

    </div>

  </div>


  <script>

   function cargarActividades() {

  const resultado = document.getElementById("resultado");

  resultado.innerHTML =
    '<div class="cargando">Cargando actividades...</div>';

  const API_URL = "https://script.google.com/macros/s/AKfycbysrXA_7XanrNqWJrNbNCxPYPpkVg_s7kNcQqh-BXaKdFDQxe5VB7vMharGENFR67iR7A/exec";

  fetch(API_URL)
    .then(function(response) {

      if (!response.ok) {
        throw new Error("No se pudo conectar con el servidor");
      }

      return response.json();

    })
    .then(function(actividades) {

      console.log("Actividades recibidas:", actividades);

      mostrarActividades(actividades);

    })
    .catch(function(error) {

      console.error("Error:", error);

      resultado.innerHTML = `
        <div class="error">
          Error al cargar actividades: ${error.message}
        </div>
      `;

    });

}

    function mostrarActividades(actividades) {

      const resultado = document.getElementById("resultado");

      if (!actividades || actividades.length === 0) {

        resultado.innerHTML = `
          <div class="error">
            No hay actividades registradas.
          </div>
        `;

        return;
      }


      let html = "<h2>Actividades disponibles</h2>";


      actividades.forEach(function(actividad) {

        html += `

          <div class="actividad" onclick="seleccionarActividad('${actividad.id}')">

            <h3>${actividad.actividad}</h3>

            <p>
              <strong>Materia:</strong>
              ${actividad.materia}
            </p>

            <p>
              <strong>Grupo:</strong>
              ${actividad.grupo}
            </p>

            <p>
              <strong>ID:</strong>
              ${actividad.id}
            </p>

          </div>

        `;

      });


      resultado.innerHTML = html;

    }


    function mostrarError(error) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <strong>Error:</strong><br>

          ${error.message || error}

        </div>

      `;

    }
function seleccionarActividad(id) {

  const resultadoDiv = document.getElementById("resultado");

  resultadoDiv.innerHTML = `
    <div class="cargando">
      Buscando actividad...
    </div>
  `;

  const API_URL = "https://script.google.com/macros/s/AKfycbysrXA_7XanrNqWJrNbNCxPYPpkVg_s7kNcQqh-BXaKdFDQxe5VB7vMharGENFR67iR7A/exec";

  fetch(API_URL)
    .then(response => response.json())
    .then(actividades => {

      const actividad = actividades.find(a => a.id === id);

      if (!actividad) {

        resultadoDiv.innerHTML = `
          <div class="error">
            No se encontró ninguna actividad con el código: ${id}
          </div>
        `;

        return;
      }

      actividadSeleccionada = actividad;

resultadoDiv.innerHTML = `

  <button class="boton-regresar" onclick="cargarActividades()">
    ← Regresar a actividades
  </button>

  <div class="actividad">

    <h2>${actividad.actividad}</h2>

    <p><strong>Materia:</strong> ${actividad.materia}</p>

    <p><strong>Grupo:</strong> ${actividad.grupo}</p>

    <p><strong>ID:</strong> ${actividad.id}</p>

    <button onclick="escanearAlumno()" class="boton-escanear">
      📷 Escanear alumno
    </button>

  </div>

`;

    })
    .catch(error => {

      resultadoDiv.innerHTML = `
        <div class="error">
          Error al buscar la actividad: ${error.message}
        </div>
      `;

    });

}

    cargarActividades();


var streamQR = null;
var escaneando = false;

    var actividadSeleccionada = null;
var modoEscaneo = "actividad";

    function escanearAlumno() {

modoEscaneo = "registro";

  iniciarEscaner();

}
    
async function iniciarEscaner() {

  const contenedor = document.getElementById("contenedor-escaner");
  const mensaje = document.getElementById("mensajeQR");
  const video = document.getElementById("videoQR");

  contenedor.style.display = "block";
  mensaje.textContent = "Iniciando cámara...";

  try {

    // Detectar si es celular
    const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    let configuracionCamara;

    if (esMovil) {

      // En celular intenta usar cámara trasera
      configuracionCamara = {
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      };

    } else {

      // En computadora usa cualquier cámara disponible
      configuracionCamara = {
        video: true,
        audio: false
      };

    }


    streamQR = await navigator.mediaDevices.getUserMedia(
      configuracionCamara
    );

    video.srcObject = streamQR;

    await video.play();

    mensaje.textContent =
      "Cámara activada. Apunta hacia el código QR.";


const detectorQR = new BarcodeDetector({
  formats: ["qr_code"]
});

async function detectarQR() {

  if (!streamQR) return;

  try {

    const codigos = await detectorQR.detect(video);

   if (codigos.length > 0) {

   const valorQR = codigos[0].rawValue;

let codigoDetectado = valorQR;

try {
  const url = new URL(valorQR);
  const alumnoURL = url.searchParams.get("alumno");

  if (alumnoURL) {
    codigoDetectado = alumnoURL;
  }
} catch (e) {
  // El QR contiene un código normal
}

    mensaje.textContent =
        "Código detectado: " + codigoDetectado;

   if (modoEscaneo === "actividad") {

    buscarActividadQR(codigoDetectado);

} else if (modoEscaneo === "registro") {

    registrarAlumnoQR(codigoDetectado);

} else if (modoEscaneo === "consulta") {

    consultarAvanceAlumno(codigoDetectado);

}

    return;

}
  } catch (error) {

    console.error("Error leyendo QR:", error);

  }

  requestAnimationFrame(detectarQR);

}

detectarQR();
  
  } catch (error) {

    console.error("Error de cámara:", error);

    mensaje.textContent =
      "No se pudo acceder a la cámara. " +
      error.name + ": " + error.message;

  }

}


function detenerEscaner() {

  const contenedor = document.getElementById("contenedor-escaner");
  const video = document.getElementById("videoQR");

  if (streamQR) {

    streamQR.getTracks().forEach(track => track.stop());

    streamQR = null;

  }

  video.srcObject = null;

  contenedor.style.display = "none";

}

      
    function buscarActividadQR(idQR) {

  idQR = idQR.trim();

  detenerEscaner();

  document.getElementById("resultado").innerHTML = `
    <div class="cargando">
      Buscando actividad...
    </div>
  `;

  seleccionarActividad(idQR);

}

    function escanearAlumno() {

   modoEscaneo = "registro";
      
  iniciarEscaner();

}

function registrarAlumnoQR(codigoAlumno) {

    detenerEscaner();

    document.getElementById("resultado").innerHTML = `
        <div class="cargando">
            Registrando alumno...
        </div>
    `;

  const API_URL = "https://script.google.com/macros/s/AKfycbysrXA_7XanrNqWJrNbNCxPYPpkVg_s7kNcQqh-BXaKdFDQxe5VB7vMharGENFR67iR7A/exec";

fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
        alumno: codigoAlumno,
        actividad: actividadSeleccionada
    })
})
.then(response => response.json())
.then(datos => {

    if (datos.success) {

        document.getElementById("resultado").innerHTML = `
            <div class="exito">
                <h2>✓ Alumno registrado correctamente</h2>

                <p><strong>Alumno:</strong> ${datos.alumno}</p>

                <button onclick="iniciarEscaner()" class="boton-escanear">
    📷 Escanear siguiente alumno
</button>
            </div>
        `;

    } else {

        document.getElementById("resultado").innerHTML = `
            <div class="error">
                ${datos.mensaje}
            </div>
        `;

    }

})
.catch(error => {

    document.getElementById("resultado").innerHTML = `
        <div class="error">
            Error al registrar al alumno.
        </div>
    `;

    console.error(error);

});

    
}
    function consultarAvanceAlumno(codigoAlumno) {

  detenerEscaner();

  document.getElementById("resultado").innerHTML = `
    <div class="cargando">
      Consultando avance del alumno...
    </div>
  `;

  const API_URL = "https://script.google.com/macros/s/AKfycbysrXA_7XanrNqWJrNbNCxPYPpkVg_s7kNcQqh-BXaKdFDQxe5VB7vMharGENFR67iR7A/exec";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      accion: "avance",
      alumno: codigoAlumno
    })
  })
  .then(response => response.json())
  .then(datos => {

    if (!datos.alumno) {
      document.getElementById("resultado").innerHTML = `
        <div class="error">
          ${datos.mensaje || "No se encontró el alumno."}
        </div>
      `;
      return;
    }

    let lista = "";

    datos.actividades.forEach(actividad => {

      const estado = actividad.estado === "REVISADA"
        ? "✅ REVISADA"
        : "⏳ PENDIENTE";

      lista += `
        <p>
          <strong>${actividad.materia}</strong> -
          ${actividad.actividad}
          <br>
          ${estado}
        </p>
      `;
    });

    document.getElementById("resultado").innerHTML = `
      <div class="exito">
        <h2>${datos.alumno.nombre}</h2>

        <p><strong>Grupo:</strong> ${datos.alumno.grupo}</p>

        <h3>Avance: ${datos.porcentaje}%</h3>

        <p>
          ✅ Revisadas: ${datos.revisadas}
          <br>
          ⏳ Pendientes: ${datos.pendientes}
          <br>
          📚 Total: ${datos.total}
        </p>

        <hr>

        ${lista}

        <button onclick="cargarActividades()" class="boton-regresar">
          ← Regresar a actividades
        </button>
      </div>
    `;
  })
  .catch(error => {

    document.getElementById("resultado").innerHTML = `
      <div class="error">
        Error al consultar el avance.
      </div>
    `;

    console.error(error);
  });
}

    function revisarAlumnoDesdeURL() {

  const parametros = new URLSearchParams(window.location.search);
  const alumno = parametros.get("alumno");

 if (alumno) {

    document.getElementById("botonProfesor").style.display = "none";
    document.getElementById("botonAlumno").style.display = "none";

    consultarAvanceAlumno(alumno);
}

}
 window.addEventListener("load", revisarAlumnoDesdeURL);   

    revisarAlumnoDesdeURL();

    function seleccionarGrupo(turno) {
    document.getElementById("resultado").innerHTML = `
        <div class="cargando">
            <h2>Selecciona el grupo</h2>

           <button class="boton" onclick="seleccionarActividadGrupo('1°A')">1° A</button>
<button class="boton" onclick="seleccionarActividadGrupo('1°B')">1° B</button>
<button class="boton" onclick="seleccionarActividadGrupo('1°C')">1° C</button>

<button class="boton" onclick="seleccionarActividadGrupo('2°A')">2° A</button>
<button class="boton" onclick="seleccionarActividadGrupo('2°B')">2° B</button>
<button class="boton" onclick="seleccionarActividadGrupo('2°C')">2° C</button>

<button class="boton" onclick="seleccionarActividadGrupo('3°A')">3° A</button>
<button class="boton" onclick="seleccionarActividadGrupo('3°B')">3° B</button>
<button class="boton" onclick="seleccionarActividadGrupo('3°C')">3° C</button>
        </div>
    `;
}

    function seleccionarActividadGrupo(grupo) {
    const resultadoDiv = document.getElementById("resultado");

    resultadoDiv.innerHTML = `
        <div class="cargando">
            <h2>Selecciona la actividad</h2>
            <p>Grupo: ${grupo}</p>
            <p>Buscando actividades...</p>
        </div>
    `;

    const API_URL = "https://script.google.com/macros/s/AKfycbysrXA_7XanrNqWJrNbNCxPYPpkVg_s7kNcQqh-BXaKdFDQxe5VB7vMharGENFR67iR7A/exec";

    fetch(API_URL)
        .then(response => response.json())
        .then(actividades => {

            const actividadesGrupo = actividades.filter(a =>
                String(a.grupo).trim() === String(grupo).trim() ||
                String(a.grupo).trim() === ""
            );

            if (actividadesGrupo.length === 0) {
                resultadoDiv.innerHTML = `
                    <div class="error">
                        No hay actividades registradas para el grupo ${grupo}.
                    </div>
                `;
                return;
            }

            let html = `
                <div class="cargando">
                    <h2>Selecciona la actividad</h2>
                    <p>Grupo: ${grupo}</p>
            `;

            actividadesGrupo.forEach(actividad => {
                html += `
                    <button class="boton" onclick="seleccionarActividad('${actividad.id}')">
                        ${actividad.materia} - ${actividad.actividad}
                    </button>
                `;
            });

            html += `</div>`;

            resultadoDiv.innerHTML = html;
        })
        .catch(error => {
            resultadoDiv.innerHTML = `
                <div class="error">
                    Error al cargar las actividades: ${error.message}
                </div>
            `;
        });
}
    
function seleccionarTurno() {
    document.getElementById("resultado").innerHTML = `
        <div class="cargando">
            <h2>Selecciona el turno</h2>

            <button class="boton" onclick="seleccionarGrupo('M')">
                ☀️ MATUTINO
            </button>

            <button class="boton" onclick="seleccionarGrupo('V')">
                🌙 VESPERTINO
            </button>
        </div>
    `;
}
    
  </script>

</body>
</html>
