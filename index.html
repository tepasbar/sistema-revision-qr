<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Revisión QR</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .contenedor {
      max-width: 900px;
      margin: 40px auto;
      padding: 25px;
    }

    .encabezado {
      background: #1a73e8;
      color: white;
      padding: 25px;
      border-radius: 15px 15px 0 0;
      text-align: center;
    }

    .encabezado h1 {
      margin: 0;
      font-size: 28px;
    }

    .encabezado p {
      margin-bottom: 0;
    }

    .contenido {
      background: white;
      padding: 25px;
      border-radius: 0 0 15px 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #333;
    }

    .actividad {
      background: #f8f9fa;
      border-left: 5px solid #1a73e8;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .actividad h3 {
      margin-top: 0;
      color: #1a73e8;
    }

    .actividad p {
      margin: 6px 0;
    }

    .boton {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .boton:hover {
      background: #1557b0;
    }

    .cargando {
      text-align: center;
      padding: 30px;
      color: #666;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 15px;
      border-radius: 8px;
    }

  </style>
</head>

<body>

  <div class="contenedor">

    <div class="encabezado">
      <h1>SISTEMA DE REVISIÓN QR</h1>
      <p>Consulta de actividades</p>
    </div>

    <div class="contenido">

      <button class="boton" onclick="cargarActividades()">
        Actualizar actividades
      </button>

      <button class="boton-qr" onclick="iniciarEscaner()">
    📷 Escanear código QR
</button>

      <div id="resultado" class="cargando">
        Cargando actividades...
      </div>

      <div id="contenedor-escaner">

    <div class="escaner-box">

        <h2>Escanear código QR</h2>

        <video id="videoQR" autoplay playsinline></video>

        <p id="mensajeQR">
            Apunta la cámara hacia el código QR
        </p>

        <button onclick="detenerEscaner()">
            Cancelar
        </button>

    </div>

</div>

    </div>

  </div>


  <script>

   function cargarActividades() {

  const resultado = document.getElementById("resultado");

  resultado.innerHTML =
    '<div class="cargando">Cargando actividades...</div>';

  const API_URL = "https://script.google.com/macros/s/AKfycbysrXA_7XanrNqWJrNbNCxPYPpkVg_s7kNcQqh-BXaKdFDQxe5VB7vMharGENFR67iR7A/exec";

  fetch(API_URL)
    .then(function(response) {

      if (!response.ok) {
        throw new Error("No se pudo conectar con el servidor");
      }

      return response.json();

    })
    .then(function(actividades) {

      console.log("Actividades recibidas:", actividades);

      mostrarActividades(actividades);

    })
    .catch(function(error) {

      console.error("Error:", error);

      resultado.innerHTML = `
        <div class="error">
          Error al cargar actividades: ${error.message}
        </div>
      `;

    });

}

    function mostrarActividades(actividades) {

      const resultado = document.getElementById("resultado");

      if (!actividades || actividades.length === 0) {

        resultado.innerHTML = `
          <div class="error">
            No hay actividades registradas.
          </div>
        `;

        return;
      }


      let html = "<h2>Actividades disponibles</h2>";


      actividades.forEach(function(actividad) {

        html += `

          <div class="actividad" onclick="seleccionarActividad('${actividad.id}')">

            <h3>${actividad.actividad}</h3>

            <p>
              <strong>Materia:</strong>
              ${actividad.materia}
            </p>

            <p>
              <strong>Grupo:</strong>
              ${actividad.grupo}
            </p>

            <p>
              <strong>ID:</strong>
              ${actividad.id}
            </p>

          </div>

        `;

      });


      resultado.innerHTML = html;

    }


    function mostrarError(error) {

      document.getElementById("resultado").innerHTML = `

        <div class="error">

          <strong>Error:</strong><br>

          ${error.message || error}

        </div>

      `;

    }
function seleccionarActividad(id) {
  google.script.run
    .withSuccessHandler(function(resultado) {
      document.getElementById("resultado").innerHTML = `
        <button class="boton-regresar" onclick="cargarActividades()">
          ← Regresar a actividades
        </button>

        <div class="actividad">
          <h2>${resultado.actividad}</h2>

          <p><strong>Materia:</strong> ${resultado.materia}</p>

          <p><strong>Grupo:</strong> ${resultado.grupo}</p>

          <p><strong>ID:</strong> ${resultado.id}</p>
        </div>
      `;
    })
    .withFailureHandler(mostrarError)
    .obtenerActividadPorId(id);
}

    cargarActividades();


var streamQR = null;
var escaneando = false;

async function iniciarEscaner() {

  const contenedor = document.getElementById("contenedor-escaner");
  const mensaje = document.getElementById("mensajeQR");
  const video = document.getElementById("videoQR");

  contenedor.style.display = "block";
  mensaje.textContent = "Iniciando cámara...";

  try {

    // Detectar si es celular
    const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    let configuracionCamara;

    if (esMovil) {

      // En celular intenta usar cámara trasera
      configuracionCamara = {
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      };

    } else {

      // En computadora usa cualquier cámara disponible
      configuracionCamara = {
        video: true,
        audio: false
      };

    }


    streamQR = await navigator.mediaDevices.getUserMedia(
      configuracionCamara
    );

    video.srcObject = streamQR;

    await video.play();

    mensaje.textContent =
      "Cámara activada. Apunta hacia el código QR.";

  } catch (error) {

    console.error("Error de cámara:", error);

    mensaje.textContent =
      "No se pudo acceder a la cámara. " +
      error.name + ": " + error.message;

  }

}


function detenerEscaner() {

  const contenedor = document.getElementById("contenedor-escaner");
  const video = document.getElementById("videoQR");

  if (streamQR) {

    streamQR.getTracks().forEach(track => track.stop());

    streamQR = null;

  }

  video.srcObject = null;

  contenedor.style.display = "none";

}
  </script>

</body>
</html>
